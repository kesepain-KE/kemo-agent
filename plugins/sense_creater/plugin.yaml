name: sense_creater
description: 热创建、列出或校验全局感知模块；创建前必须完成必要性判断、名称与采集目标确认、数据模板确认和冲突检查四步流程。感知是采集到 Prompt 注入的单向数据流，不提供操控接口。
input_schema:
  type: object
  properties:
    action:
      type: string
      enum:
      - list
      - create
      - validate
      description: list=列出模块，create=创建模块，validate=校验模块
    name:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
      description: create/validate 使用的模块目录名
    explain:
      type: string
      maxLength: 2000
      description: create 使用的一句话功能说明，写入 module.yaml
    sense_content:
      type: string
      maxLength: 100000
      description: create 使用的初始 sense.md Markdown 数据模板
    data_update:
      type: string
      maxLength: 500000
      description: create 可选自定义 data_update.py；不传则使用安全骨架
  required:
  - action
  additionalProperties: false
version: 1.1.0
enabled: true
entrypoint: tool.py:run
permission: write
origin: builtin
