schema_version: 1
provider_security:
  allowed_hosts: []
provider_runtime:
  max_concurrent_requests: 10
  request_semaphore_timeout: 300
  max_retries: 5
tools:
  enabled: true
  timeout: 240
  consecutive_identical_call_limit: 3
  invalid_tool_arguments_retries: 2
history:
  consecutive_tool_fail_limit: 5
prompt:
  char_limits:
    user_soul: 12000
    agents_manual: 26000
    task_plan: 6000
    perception: 20000
    expand_data: 20000
    skill_prompts: 80000
    plugin_prompts: 80000
memory:
  storage_schema_version: 3
  prompt_injection: true
  profile: companion
  domain_rules:
    relation:
      upgrade_threshold: 1
    state:
      upgrade_threshold: null
      refresh_expiry_on_update: true
  extraction_mode: compression_only
  extraction_input_tokens: 12000
  extraction_max_candidates_per_batch: 30
  temporary_injection_limits:
    half_year: 100
    one_month: 200
    seven_days: 300
  important_memory_max_chars: 20000
  important_memory_output_max_chars: 20000
  history_read_enabled: true
  tiers:
    seven_days:
      days: 7
      upgrade_threshold: 3
      next: one_month
    one_month:
      days: 30
      upgrade_threshold: 10
      next: half_year
    half_year:
      days: 180
      upgrade_threshold: 60
      next: null
agent_runtime:
  queue_maxsize: 50
  default_timeout: 600
  timeout_survival_seconds: 120
task_plan:
  max_steps: 20
  auto_retry_on_fix: false
cron:
  enabled: true
  history_retention_days: 7
  log_retention_days: 30
  task_cron_system:
    expand_update:
      interval_seconds: 30
  session_idle_close_seconds: 5400
  poll_interval: 30
  avoid_congestion: true
  congestion_threshold_ratio: 0.2
task_cron_system:
  sense_update_rate: 5
  module_update_timeout: 120
  runtime_checkpoint_seconds: 300
  success_log_flush_seconds: 3600
runtime_host:
  enable_background_scheduler: true
history_summary:
  poll_interval: 5
  max_jobs_per_cycle: 3
  max_attempts: 5
  retry_delays_seconds:
  - 30
  - 120
  - 600
  - 1800
message:
  max_workers: 8
  max_queued_messages: 20
web:
  max_concurrent_chats: 3
  max_pending_chats: 5
  pending_chat_timeout: 30
  sse_heartbeat_seconds: 15
agents:
  compression_timeout_seconds: 180
  output_reserve: 8192
  token_limit: 1000000
  token_compression_ratio: 0.3
  important_memory_review_hours: 3
  daily_memory_review_time: 02:00
