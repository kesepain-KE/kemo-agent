name: file
description: 文件操作工具集 — 读取、写入、编辑、搜索、校验、列目录、复制、移动、创建目录、删除。大文件有截断保护，tail 模式从文件尾部有限读取，内容搜索排除已知二进制格式。
input_schema:
  type: object
  properties:
    action:
      type: string
      enum:
      - exists
      - read
      - read_range
      - write
      - append
      - edit
      - list_dir
      - tree_dir
      - stat
      - search
      - hash
      - copy
      - move
      - make_dir
      - delete
      description: 操作类型
    path:
      type: string
      minLength: 1
      description: 文件或目录路径
    content:
      type: string
      description: write/append 写入内容；edit 旧版新文本参数，仅为兼容保留
    new_text:
      type: string
      description: edit 的新文本（推荐）；replace_text 可传空字符串删除精确匹配，删除整行使用 delete_line/delete_range
    encoding:
      type: string
      description: 文本编码，默认 utf-8，失败时尝试系统编码
    start_line:
      type: integer
      minimum: 0
      description: read_range 起始行号（1-based；0 表示默认）
    end_line:
      type: integer
      minimum: 0
      description: read_range 结束行号或 edit replace_range/delete_range 结束行号
    tail:
      type: integer
      minimum: 0
      description: read_range 读取尾部 N 行
    max_lines:
      type: integer
      minimum: 1
      maximum: 50000
      description: read_range 最大返回行数，默认 500
    max_bytes:
      type: integer
      minimum: 1
      maximum: 536870912
      description: read/read_range 最大读取字节数，默认 52428800（50 MB）
    edit_mode:
      type: string
      enum:
      - insert
      - replace_line
      - replace_range
      - replace_text
      - delete_line
      - delete_range
      description: edit 编辑模式；删除完整行必须使用 delete_line/delete_range
    old_text:
      type: string
      description: edit replace_text 要替换的原文
    expected_old_text:
      type: string
      description: replace_line/replace_range/delete_line/delete_range 当前目标区域的精确原文；必须来自最近一次 read_range
    expected_hash:
      type: string
      pattern: ^[0-9a-fA-F]{64}$
      description: 读取时返回的整个文件 SHA256；insert 必填，其他编辑可选，用于拒绝陈旧写入
    expected_count:
      type: integer
      minimum: -1
      description: edit 期望匹配次数；-1 跳过检查
    line:
      type: integer
      minimum: 1
      description: edit 起始行号（1-based）
    column:
      type: integer
      minimum: 1
      description: edit 起始列号（1-based）
    end_column:
      type: integer
      minimum: 0
      description: edit replace_range 结束列号
    dst_path:
      type: string
      minLength: 1
      description: copy/move 目标路径
    overwrite:
      type: boolean
      description: copy/move 是否覆盖已有目标
    recursive:
      type: boolean
      description: copy 是否递归复制目录；目录复制必须为 true
    max_depth:
      type: integer
      minimum: 0
      maximum: 50
      description: tree_dir 最大深度，默认 2
    max_entries:
      type: integer
      minimum: 1
      maximum: 1000
      description: tree_dir 最大条目数，默认 200
    offset:
      type: integer
      minimum: 0
      description: list_dir/tree_dir 分页偏移，默认 0
    limit:
      type: integer
      minimum: 1
      maximum: 1000
      description: list_dir/tree_dir 当前页最大条目数，默认 200；tree_dir 省略时兼容使用 max_entries
    include_hidden:
      type: boolean
      description: tree_dir/search 是否包含隐藏文件
    query:
      type: string
      description: search 搜索词或正则
    mode:
      type: string
      enum:
      - name
      - content
      description: search 搜索模式：name 按文件名匹配，content 按文件内容匹配
    file_glob:
      type: string
      description: search 文件名 glob 过滤
    max_results:
      type: integer
      minimum: 1
      maximum: 5000
      description: search 最大结果数，默认 50
    context_lines:
      type: integer
      minimum: 0
      maximum: 100
      description: search 匹配行上下文行数
    regex:
      type: boolean
      description: search 是否按正则处理 query
    max_file_bytes:
      type: integer
      minimum: 1
      maximum: 536870912
      description: search 单文件最大读取字节数，默认 52428800（50 MB）
    algorithm:
      type: string
      enum:
      - md5
      - sha1
      - sha256
      description: hash 算法，默认 sha256
    parents:
      type: boolean
      description: make_dir 是否递归创建父目录，默认 true
  required:
  - action
  - path
  additionalProperties: false
version: 1.4.0
enabled: true
entrypoint: tool.py:run
permission: delete
origin: builtin
